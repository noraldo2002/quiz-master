<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>سين جيم Pro Ultimate</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: radial-gradient(circle, #0b1220, #05070f);
    color: white;
    margin: 0;
}

/* Buttons */
button {
    padding: 14px;
    margin: 6px;
    width: 85%;
    border: none;
    border-radius: 15px;
    font-size: 16px;
}

/* Splash */
#splash {
position:fixed;
width:100%; height:100%;
background:#05070f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* Inputs */
input{
padding:10px;
margin:5px;
border-radius:10px;
width:70%;
text-align:center;
}

/* Category Cards */
.catGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:90%;
margin:auto;
}

.cat{
background:#111827;
border:1px solid #334155;
padding:15px;
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.cat:hover{
transform:scale(1.05);
background:#1f2937;
}

.icon{
font-size:30px;
}

/* Game */
.option{
background:#111827;
border:1px solid #334155;
color:white;
}

#game, #menu, #categories, #result{
display:none;
}

#question{
margin:20px;
font-size:18px;
}
</style>
</head>

<body>

<!-- 🚀 SPLASH -->
<div id="splash">

<h1>🎮 سين جيم Pro</h1>

<input id="team1" placeholder="اسم الفريق الأول">
<input id="team2" placeholder="اسم الفريق الثاني">

<button onclick="goMenu()" style="background:#22c55e;color:white;">
ابدأ اللعب
</button>

</div>

<!-- MENU -->
<div id="menu">
<h2>اختر الفئة</h2>

<div class="catGrid">

<div class="cat" onclick="startQuiz('general')">
<div class="icon">📚</div>
معلومات عامة
</div>

<div class="cat" onclick="startQuiz('science')">
<div class="icon">🔬</div>
علوم
</div>

<div class="cat" onclick="startQuiz('sports')">
<div class="icon">⚽</div>
رياضة
</div>

<div class="cat" onclick="startQuiz('series')">
<div class="icon">🎬</div>
مسلسلات
</div>

<div class="cat" onclick="startQuiz('hadith')">
<div class="icon">📿</div>
أحاديث نبوية
</div>

<div class="cat" onclick="startQuiz('players')">
<div class="icon">🏃</div>
لاعبين كرة قدم
</div>

<div class="cat" onclick="startQuiz('prophets')">
<div class="icon">🕌</div>
قصص الأنبياء
</div>

<div class="cat" onclick="startQuiz('war')">
<div class="icon">⚔️</div>
الحرب العالمية
</div>

</div>
</div>

<!-- GAME -->
<div id="game">

<h3 id="teams"></h3>

<div>⭐ <span id="score"></span></div>

<h3 id="question"></h3>

<button class="option" onclick="answer('A')" id="A"></button>
<button class="option" onclick="answer('B')" id="B"></button>
<button class="option" onclick="answer('C')" id="C"></button>
<button class="option" onclick="answer('D')" id="D"></button>

<p>⏱ <span id="time">15</span></p>

</div>

<!-- RESULT -->
<div id="result">
<h2>🎉 انتهت اللعبة</h2>
<p id="final"></p>
<button onclick="location.reload()">إعادة</button>
</div>

<script>

let teamA, teamB;
let scoreA=0, scoreB=0;
let turn="A";

let questions=[];
let current=0;
let timer;
let timeLeft=15;

/* 🚀 بداية */
function goMenu(){
 teamA = document.getElementById("team1").value || "A";
 teamB = document.getElementById("team2").value || "B";

 document.getElementById("splash").style.display="none";
 document.getElementById("menu").style.display="block";
}

/* 🎯 الأسئلة */
let data = {
general:[
{q:"ما عاصمة الأردن؟",a:"عمان",b:"دمشق",c:"بيروت",d:"بغداد",correct:"A"}
],

science:[
{q:"أكبر كوكب؟",a:"الأرض",b:"المريخ",c:"المشتري",d:"الزهرة",correct:"C"}
],

sports:[
{q:"لاعبين كرة القدم؟",a:"9",b:"10",c:"11",d:"12",correct:"C"}
],

series:[
{q:"بطل الولادة من الخاصرة؟",a:"تيم حسن",b:"قصي خولي",c:"باسل خياط",d:"آخر",correct:"B"}
],

hadith:[
{q:"أكمل الحديث: إنما الأعمال بالنيات...",a:"وبالصبر",b:"ولكل امرئ ما نوى",c:"والإيمان",d:"والصدق",correct:"B"}
],

players:[
{q:"أين يلعب ميسي؟",a:"ريال مدريد",b:"إنتر ميامي",c:"باريس",d:"برشلونة",correct:"B"}
],

prophets:[
{q:"من كفل مريم؟",a:"زكريا",b:"نوح",c:"موسى",d:"يوسف",correct:"A"}
],

war:[
{q:"متى بدأت الحرب العالمية الثانية؟",a:"1914",b:"1939",c:"1945",d:"1920",correct:"B"}
]
};

/* 🔀 */
function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

/* 🎮 */
function startQuiz(cat){

 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 questions = shuffle(data[cat]);
 current=0;

 load();
 startTimer();
}

/* ❓ */
function load(){

 let q=questions[current];

 document.getElementById("teams").innerText =
 teamA+" vs "+teamB;

 document.getElementById("score").innerText =
 teamA+":"+scoreA+" | "+teamB+":"+scoreB;

 document.getElementById("question").innerText="❓ "+q.q;

 document.getElementById("A").innerText=q.a;
 document.getElementById("B").innerText=q.b;
 document.getElementById("C").innerText=q.c;
 document.getElementById("D").innerText=q.d;

 timeLeft=15;
 document.getElementById("time").innerText=timeLeft;
}

/* 🔘 */
function answer(choice){

 let q=questions[current];

 if(choice==q.correct){
  if(turn=="A") scoreA+=10;
  else scoreB+=10;
 }

 turn=(turn=="A")?"B":"A";

 current++;

 if(current>=questions.length){
  end();
 }else{
  load();
 }
}

/* ⏱ */
function startTimer(){
 clearInterval(timer);

 timer=setInterval(()=>{
  timeLeft--;
  document.getElementById("time").innerText=timeLeft;

  if(timeLeft<=0){
    current++;
    if(current>=questions.length) end();
    else load();
  }
 },1000);
}

/* 🏁 */
function end(){
 clearInterval(timer);

 document.getElementById("game").style.display="none";
 document.getElementById("result").style.display="block";

 let win="تعادل";

 if(scoreA>scoreB) win=teamA+" فاز 🏆";
 else if(scoreB>scoreA) win=teamB+" فاز 🏆";

 document.getElementById("final").innerText=
 teamA+":"+scoreA+"\n"+teamB+":"+scoreB+"\n\n"+win;
}

</script>

</body>
</html>
