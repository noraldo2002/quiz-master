<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>سين جيم - Pro Game</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: radial-gradient(circle, #0b1220, #05070f);
    color: white;
    margin: 0;
}

button {
    padding: 14px;
    margin: 6px;
    width: 85%;
    border: none;
    border-radius: 15px;
    font-size: 16px;
}

.category {
    background: linear-gradient(45deg, #2563eb, #3b82f6);
    color: white;
    font-weight: bold;
}

.option {
    background: #111827;
    border: 1px solid #334155;
    color: white;
}

#container { margin-top: 30px; }

/* Splash */
#splashScreen{
position:fixed;
top:0; left:0;
width:100%; height:100%;
background:#05070f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input{
padding:10px;
margin:5px;
border-radius:10px;
text-align:center;
width:70%;
}

/* Result */
#result { display:none; }

#question {
    margin: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<!-- 🚀 START SCREEN -->
<div id="splashScreen">

<h1>🎮 سين جيم Pro</h1>

<input id="playerName" placeholder="اسم اللاعب">

<input id="team1" placeholder="اسم الفريق الأول">
<input id="team2" placeholder="اسم الفريق الثاني">

<button onclick="startApp()" style="background:#22c55e; color:white;">
ابدأ التحدي 🔥
</button>

</div>

<h2>🎮 سين جيم</h2>

<div id="container">

<!-- MENU -->
<div id="menu" style="display:none;">

<button class="category" onclick="startQuiz('general')">📚 معلومات عامة</button>
<button class="category" onclick="startQuiz('science')">🔬 علوم</button>
<button class="category" onclick="startQuiz('sports')">⚽ رياضة</button>
<button class="category" onclick="startQuiz('series')">🎬 مسلسلات</button>

</div>

<!-- GAME -->
<div id="game" style="display:none;">

<div>
⭐ <span id="score">0</span>
</div>

<h3 id="question"></h3>

<button class="option" onclick="answer('A')" id="A"></button>
<button class="option" onclick="answer('B')" id="B"></button>
<button class="option" onclick="answer('C')" id="C"></button>
<button class="option" onclick="answer('D')" id="D"></button>

<p>⏱ الوقت: <span id="time">15</span></p>

</div>

<!-- RESULT -->
<div id="result">
<h2>🎉 انتهت اللعبة</h2>
<p id="finalText"></p>
<button onclick="location.reload()">إعادة اللعب</button>
</div>

</div>

<script>

let player = "";
let teamA = "A";
let teamB = "B";

let scoreA = 0;
let scoreB = 0;

let turn = "A";
let comboA = 0;
let comboB = 0;

let questions = [];
let current = 0;
let timer;
let timeLeft = 15;

/* 🚀 تشغيل */
function startApp(){

 player = document.getElementById("playerName").value;

 teamA = document.getElementById("team1").value || "الفريق 1";
 teamB = document.getElementById("team2").value || "الفريق 2";

 document.getElementById("splashScreen").style.display="none";
 document.getElementById("menu").style.display="block";
}

/* 🎯 الأسئلة */
let data = {
 general: [
  {q:"ما عاصمة الأردن؟", a:"عمان", b:"دمشق", c:"بيروت", d:"بغداد", correct:"A"},
  {q:"عدد القارات؟", a:"5", b:"6", c:"7", d:"8", correct:"C"}
 ],

 science: [
  {q:"أكبر كوكب؟", a:"الأرض", b:"المريخ", c:"المشتري", d:"الزهرة", correct:"C"},
  {q:"وحدة القوة؟", a:"نيوتن", b:"جول", c:"واط", d:"أمبير", correct:"A"}
 ],

 sports: [
  {q:"لاعبين كرة القدم؟", a:"9", b:"10", c:"11", d:"12", correct:"C"},
  {q:"مدة المباراة؟", a:"90", b:"80", c:"100", d:"70", correct:"A"}
 ],

 series: [
  {q:"بطل الولادة من الخاصرة؟", a:"تيم حسن", b:"قصي خولي", c:"باسل خياط", d:"معتصم النهار", correct:"B"},
  {q:"نوع المسلسل؟", a:"دراما", b:"كوميدي", c:"أكشن", d:"رعب", correct:"A"}
 ]
};

/* 🔀 خلط */
function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

/* 🎮 بدء */
function startQuiz(cat){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 questions = shuffle(data[cat]);
 current = 0;

 loadQuestion();
 startTimer();
}

/* ❓ سؤال */
function loadQuestion(){

 let q = questions[current];

 document.getElementById("question").innerText =
 "❓ " + q.q + " ("+(current+1)+"/"+questions.length+")";

 document.getElementById("A").innerText = q.a;
 document.getElementById("B").innerText = q.b;
 document.getElementById("C").innerText = q.c;
 document.getElementById("D").innerText = q.d;

 timeLeft = 15;
 document.getElementById("time").innerText = timeLeft;

 enableButtons();
}

/* 🔘 إجابة */
function answer(choice){

 let q = questions[current];

 disableButtons();
 clearInterval(timer);

 let correct = (choice == q.correct);

 if(correct){

  if(turn === "A"){
   comboA++;
   scoreA += 10 + (comboA * 2);
  } else {
   comboB++;
   scoreB += 10 + (comboB * 2);
  }

 } else {
  if(turn === "A") comboA = 0;
  else comboB = 0;
 }

 turn = (turn === "A") ? "B" : "A";

 updateScore();

 setTimeout(nextQuestion, 600);
}

/* ⏭ التالي */
function nextQuestion(){

 current++;

 if(current >= questions.length){
  endGame();
 } else {
  loadQuestion();
  startTimer();
 }
}

/* ⏱ Timer */
function startTimer(){

 clearInterval(timer);

 timer = setInterval(()=>{

  timeLeft--;
  document.getElementById("time").innerText = timeLeft;

  if(timeLeft <= 0){
    nextQuestion();
  }

 },1000);
}

/* ⭐ نقاط */
function updateScore(){
 document.getElementById("score").innerText =
 teamA + ":" + scoreA + " | " + teamB + ":" + scoreB;
}

/* 🔒 أزرار */
function disableButtons(){
 ["A","B","C","D"].forEach(id=>{
  document.getElementById(id).disabled = true;
 });
}

function enableButtons(){
 ["A","B","C","D"].forEach(id=>{
  document.getElementById(id).disabled = false;
 });
}

/* 🏁 نهاية */
function endGame(){

 clearInterval(timer);

 document.getElementById("game").style.display="none";
 document.getElementById("result").style.display="block";

 let winner = "";

 if(scoreA > scoreB) winner = "🏆 " + teamA + " فاز";
 else if(scoreB > scoreA) winner = "🏆 " + teamB + " فاز";
 else winner = "🤝 تعادل";

 document.getElementById("finalText").innerText =
 "👤 اللاعب: " + player +
 "\n\n" +
 teamA + ": " + scoreA +
 "\n" +
 teamB + ": " + scoreB +
 "\n\n" +
 winner;
}

</script>

</body>
</html>
