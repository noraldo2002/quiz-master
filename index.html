<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>سين جيم Pro Ultimate</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: radial-gradient(circle, #0b1220, #05070f);
    color: white;
    margin: 0;
}

button {
    padding: 14px;
    margin: 6px;
    width: 85%;
    border: none;
    border-radius: 15px;
    font-size: 16px;
}

.category {
    background: linear-gradient(45deg, #2563eb, #3b82f6);
    color: white;
}

.option {
    background: #111827;
    border: 1px solid #334155;
    color: white;
}

#splash {
position:fixed;
width:100%; height:100%;
background:#05070f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

input{
padding:10px;
margin:5px;
border-radius:10px;
width:70%;
text-align:center;
}

#game,#menu,#result{display:none;}

#question{
margin:20px;
font-size:18px;
}
</style>
</head>

<body>

<!-- 🔊 AUDIO SYSTEM -->
<audio id="bgMusic" loop></audio>
<audio id="fx"></audio>

<!-- 🚀 SPLASH -->
<div id="splash">

<h1>🎮 سين جيم Pro</h1>

<input id="team1" placeholder="الفريق الأول">
<input id="team2" placeholder="الفريق الثاني">

<button onclick="startApp()" style="background:#22c55e;color:white;">
ابدأ اللعب
</button>

</div>

<!-- MENU -->
<div id="menu">

<button class="category" onclick="startQuiz('general')">📚 معلومات</button>
<button class="category" onclick="startQuiz('science')">🔬 علوم</button>
<button class="category" onclick="startQuiz('sports')">⚽ رياضة</button>
<button class="category" onclick="startQuiz('series')">🎬 مسلسلات</button>

</div>

<!-- GAME -->
<div id="game">

<div>
⭐ <span id="score"></span>
</div>

<h3 id="question"></h3>

<button class="option" onclick="answer('A')" id="A"></button>
<button class="option" onclick="answer('B')" id="B"></button>
<button class="option" onclick="answer('C')" id="C"></button>
<button class="option" onclick="answer('D')" id="D"></button>

<p>⏱ <span id="time">15</span></p>

</div>

<!-- RESULT -->
<div id="result">
<h2>🎉 انتهت اللعبة</h2>
<p id="final"></p>
<button onclick="location.reload()">إعادة</button>
</div>

<script>

let teamA, teamB;
let scoreA=0, scoreB=0;
let turn="A";

let questions=[];
let current=0;
let timer;
let timeLeft=15;

/* 🚀 تشغيل */
function startApp(){

 teamA=document.getElementById("team1").value||"A";
 teamB=document.getElementById("team2").value||"B";

 document.getElementById("splash").style.display="none";
 document.getElementById("menu").style.display="block";

 // 🎵 موسيقى الخلفية
 let bg = document.getElementById("bgMusic");
 bg.src = "voice/bg.mp3";
 bg.volume = 0.3;
 bg.play();
}

/* 🎧 صوت */
function playSound(type){

 let fx = document.getElementById("fx");

 switch(type){

  case "click":
   fx.src = "voice/click.mp3";
   break;

  case "correct":
   fx.src = "voice/correct.mp3";
   break;

  case "wrong":
   fx.src = "voice/wrong.mp3";
   break;

  case "question":
   fx.src = "voice/question.mp3";
   break;

  case "win":
   fx.src = "voice/win.mp3";
   break;
 }

 fx.play();
}

/* 🎯 أسئلة */
let data={
general:[
{q:"ما عاصمة الأردن؟",a:"عمان",b:"دمشق",c:"بيروت",d:"بغداد",correct:"A"}
],
science:[
{q:"أكبر كوكب؟",a:"الأرض",b:"المريخ",c:"المشتري",d:"الزهرة",correct:"C"}
],
sports:[
{q:"لاعبين كرة القدم؟",a:"9",b:"10",c:"11",d:"12",correct:"C"}
],
series:[
{q:"بطل الولادة من الخاصرة؟",a:"تيم حسن",b:"قصي خولي",c:"باسل خياط",d:"آخر",correct:"B"}
]
};

/* 🔀 */
function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

/* 🎮 */
function startQuiz(cat){

 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 questions=shuffle(data[cat]);
 current=0;

 load();
 startTimer();
}

/* ❓ */
function load(){

 playSound("question");

 let q=questions[current];

 document.getElementById("question").innerText="❓ "+q.q;

 document.getElementById("A").innerText=q.a;
 document.getElementById("B").innerText=q.b;
 document.getElementById("C").innerText=q.c;
 document.getElementById("D").innerText=q.d;

 timeLeft=15;
 document.getElementById("time").innerText=timeLeft;
}

/* 🔘 */
function answer(choice){

 playSound("click");

 let q=questions[current];

 if(choice==q.correct){
  playSound("correct");

  if(turn=="A") scoreA+=10;
  else scoreB+=10;

 } else {
  playSound("wrong");
 }

 turn=(turn=="A")?"B":"A";

 current++;

 if(current>=questions.length){
  end();
 }else{
  load();
 }
}

/* ⏱ */
function startTimer(){
 clearInterval(timer);

 timer=setInterval(()=>{
  timeLeft--;
  document.getElementById("time").innerText=timeLeft;

  if(timeLeft<=0){
    current++;
    if(current>=questions.length) end();
    else load();
  }
 },1000);
}

/* ⭐ */
function updateScore(){
 document.getElementById("score").innerText=
 teamA+":"+scoreA+" | "+teamB+":"+scoreB;
}

/* 🏁 */
function end(){

 playSound("win");

 clearInterval(timer);

 document.getElementById("game").style.display="none";
 document.getElementById("result").style.display="block";

 let win="تعادل";

 if(scoreA>scoreB) win=teamA+" فاز 🏆";
 else if(scoreB>scoreA) win=teamB+" فاز 🏆";

 document.getElementById("final").innerText=
 teamA+":"+scoreA+"\n"+teamB+":"+scoreB+"\n\n"+win;
}

</script>

</body>
</html>
