<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quiz Master</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #0f172a;
    color: white;
}

button {
    padding: 12px;
    margin: 5px;
    width: 80%;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.category { background: #2563eb; color: white; }
.option { background: #1e293b; color: white; }

#box { margin-top: 50px; }
</style>
</head>

<body>

<div id="box">

<h2>🎮 Quiz Master</h2>

<div id="menu">
    <button class="category" onclick="startQuiz('general')">معلومات عامة</button>
    <button class="category" onclick="startQuiz('science')">علوم</button>
    <button class="category" onclick="startQuiz('sports')">رياضة</button>
</div>

<div id="quiz" style="display:none;">
    <h3 id="question"></h3>

    <button class="option" onclick="answer('A')" id="A"></button>
    <button class="option" onclick="answer('B')" id="B"></button>
    <button class="option" onclick="answer('C')" id="C"></button>
    <button class="option" onclick="answer('D')" id="D"></button>

    <p>⏱ الوقت: <span id="time">15</span></p>
    <p>⭐ النقاط: <span id="score">0</span></p>
</div>

<div id="result" style="display:none;">
    <h2>انتهت اللعبة 🎉</h2>
    <p>نتيجتك: <span id="finalScore"></span></p>
    <button onclick="location.reload()">إعادة</button>
</div>

</div>

<script>

let data = {
 general: [
  {q:"ما عاصمة الأردن؟", a:"عمان", b:"دمشق", c:"القاهرة", d:"بغداد", correct:"A"},
  {q:"كم عدد قارات العالم؟", a:"5", b:"6", c:"7", d:"8", correct:"C"}
 ],
 science: [
  {q:"ما أكبر كوكب؟", a:"الأرض", b:"المريخ", c:"المشتري", d:"الزهرة", correct:"C"}
 ],
 sports: [
  {q:"كم لاعب كرة قدم؟", a:"9", b:"10", c:"11", d:"12", correct:"C"}
 ]
};

let current = 0;
let score = 0;
let questions = [];
let timer;
let timeLeft = 15;

function startQuiz(cat){
 document.getElementById("menu").style.display="none";
 document.getElementById("quiz").style.display="block";

 questions = data[cat];
 current = 0;
 score = 0;
 loadQuestion();
 startTimer();
}

function loadQuestion(){
 let q = questions[current];

 document.getElementById("question").innerText = q.q;
 document.getElementById("A").innerText = q.a;
 document.getElementById("B").innerText = q.b;
 document.getElementById("C").innerText = q.c;
 document.getElementById("D").innerText = q.d;

 timeLeft = 15;
 document.getElementById("time").innerText = timeLeft;
}

function answer(choice){
 let q = questions[current];

 if(choice == q.correct){
  score += 10;
  document.getElementById("score").innerText = score;
 }

 current++;

 if(current >= questions.length){
  endGame();
 } else {
  loadQuestion();
 }
}

function startTimer(){
 clearInterval(timer);

 timer = setInterval(()=>{
  timeLeft--;
  document.getElementById("time").innerText = timeLeft;

  if(timeLeft <= 0){
    current++;
    if(current >= questions.length){
      endGame();
    } else {
      loadQuestion();
    }
    timeLeft = 15;
  }
 },1000);
}

function endGame(){
 clearInterval(timer);
 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("finalScore").innerText = score;
}

</script>

</body>
</html>
