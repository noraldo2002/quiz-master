<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 لعبة التحدي 🔥</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    direction:rtl;
    text-align:center;
}

.screen{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

button{
    padding:15px 25px;
    margin:10px;
    border:none;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
}

.start-btn{
    background:red;
    color:white;
    font-size:28px;
}

.card{
    background:#222;
    width:240px;
    margin:15px auto;
    padding:20px;
    border-radius:15px;
    font-size:22px;
}

input{
    padding:12px;
    width:250px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

#answerBox{
    margin-top:30px;
}

.board{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:30px;
}

.team-box{
    background:#222;
    padding:20px;
    border-radius:20px;
}

.question-btn{
    display:block;
    width:100%;
    margin:10px 0;
    background:#444;
    color:white;
    font-size:20px;
}

.question-btn:hover{
    background:#666;
}

</style>
</head>

<body>

<!-- البداية -->

<div id="startScreen" class="screen active">

    <h1>🔥 لعبة التحدي 🔥</h1>

    <button class="start-btn" onclick="goTeams()">
        ابدأ الطحن
    </button>

</div>

<!-- الفرق -->

<div id="teamScreen" class="screen">

    <h1>⚔️ أدخل أسماء الفرق</h1>

    <input id="team1" placeholder="الفريق الأول">

    <br>

    <input id="team2" placeholder="الفريق الثاني">

    <br>

    <button onclick="goCategories()">
        متابعة
    </button>

</div>

<!-- الفئات -->

<div id="categoryScreen" class="screen"></div>

<!-- شاشة السؤال -->

<div id="gameScreen" class="screen"></div>

<script>

// التنقل بين الشاشات

function showScreen(id){

    document.querySelectorAll('.screen')
    .forEach(screen => screen.classList.remove('active'));

    document.getElementById(id)
    .classList.add('active');

}

// البداية

function goTeams(){

    showScreen('teamScreen');

}

// الأسئلة

let questions = {

"أرقام لاعبين":[

{q:"ما رقم ليونيل ميسي؟", answer:"10"},
{q:"ما رقم كريستيانو رونالدو؟", answer:"7"},
{q:"ما رقم محمد صلاح؟", answer:"11"},
{q:"ما رقم نيمار؟", answer:"10"},
{q:"ما رقم مبابي؟", answer:"7"}

],

"أسماء لاعبين":[

{q:"من لاعب برشلونة والأرجنتين الأسطوري؟", answer:"ليونيل ميسي"},
{q:"من نجم البرتغال؟", answer:"كريستيانو رونالدو"},
{q:"من الفرعون المصري؟", answer:"محمد صلاح"},
{q:"من لاعب فرنسا السريع؟", answer:"كيليان مبابي"},
{q:"من أسطورة البرازيل؟", answer:"بيليه"}

],

"كرة قدم عالمية":[

{q:"أين أقيم كأس العالم 2022؟", answer:"قطر"},
{q:"من أكثر منتخب فاز بكأس العالم؟", answer:"البرازيل"},
{q:"كم عدد لاعبي كرة القدم؟", answer:"11"},
{q:"ما النادي الملكي؟", answer:"ريال مدريد"},
{q:"ما النادي الملقب بالشياطين الحمر؟", answer:"مانشستر يونايتد"}

],

"من هو اللاعب":[

{q:"من هو اللاعب الملقب بالدون؟", answer:"كريستيانو رونالدو"},
{q:"من هو البرغوث؟", answer:"ليونيل ميسي"},
{q:"من هو الجوهرة السوداء؟", answer:"بيليه"},
{q:"من هو الفرعون المصري؟", answer:"محمد صلاح"},
{q:"من هو اللاعب الفرنسي السريع؟", answer:"مبابي"}

],

"قصص أنبياء":[

{q:"من هو أول نبي؟", answer:"آدم عليه السلام"},
{q:"من النبي الذي ابتلعه الحوت؟", answer:"يونس عليه السلام"},
{q:"من النبي الذي بنى السفينة؟", answer:"نوح عليه السلام"},
{q:"من كليم الله؟", answer:"موسى عليه السلام"},
{q:"من أبو الأنبياء؟", answer:"إبراهيم عليه السلام"}

],

"القرآن الكريم":[

{q:"كم عدد سور القرآن الكريم؟", answer:"114"},
{q:"ما أطول سورة في القرآن؟", answer:"البقرة"},
{q:"ما أقصر سورة؟", answer:"الكوثر"},
{q:"ما أول سورة؟", answer:"الفاتحة"},
{q:"ما آخر سورة؟", answer:"الناس"}

],

"السيرة النبوية":[

{q:"أين ولد النبي ﷺ؟", answer:"مكة"},
{q:"ما اسم أم النبي ﷺ؟", answer:"آمنة"},
{q:"من أول زوجات النبي ﷺ؟", answer:"خديجة"},
{q:"كم عمر النبي ﷺ عند البعثة؟", answer:"40 سنة"},
{q:"إلى أين هاجر النبي ﷺ؟", answer:"المدينة"}

],

"جزء تبارك":[

{q:"ما أول سورة في جزء تبارك؟", answer:"الملك"},
{q:"كم عدد آيات سورة الملك؟", answer:"30"},
{q:"ما السورة المنجية؟", answer:"سورة الملك"},
{q:"ما آخر سورة في جزء تبارك؟", answer:"المرسلات"},
{q:"في أي جزء توجد سورة الجن؟", answer:"جزء تبارك"}

],

"إسلامي عام":[

{q:"كم عدد أركان الإسلام؟", answer:"5"},
{q:"كم عدد الصلوات المفروضة؟", answer:"5"},
{q:"ما قبلة المسلمين؟", answer:"الكعبة"},
{q:"في أي شهر يصوم المسلمون؟", answer:"رمضان"},
{q:"ما ليلة نزول القرآن؟", answer:"ليلة القدر"}

],

"أغاني سبيستون":[

{q:"من يغني حلمي تحطم واختفى؟", answer:"ريمي"},
{q:"ما الكوكب الخاص بالرياضة؟", answer:"زمردة"},
{q:"ما اسم قناة الأطفال الشهيرة؟", answer:"سبيستون"},
{q:"من صاحب أغنية بداية القناص؟", answer:"رشا رزق"},
{q:"ما اسم كوكب المغامرات؟", answer:"مغامرات"}

],

"ناروتو":[

{q:"ما اسم بطل الأنمي؟", answer:"ناروتو"},
{q:"ما اسم صديق ناروتو؟", answer:"ساسكي"},
{q:"من معلمة الفريق 7؟", answer:"كاكاشي"},
{q:"ما اسم الوحش داخل ناروتو؟", answer:"الكيوبي"},
{q:"ما اسم قرية ناروتو؟", answer:"الورقة"}

],

"شارات سبيستون":[

{q:"من صاحب شارة القناص؟", answer:"رشا رزق"},
{q:"ما الأنمي الذي يحتوي على عبارة ننطلق؟", answer:"هزيم الرعد"},
{q:"أي شارة فيها كلمة أبطال؟", answer:"أبطال الكرة"},
{q:"أي شارة تبدأ بـ في دربنا؟", answer:"سابق ولاحق"},
{q:"أي شارة فيها سأرسم دربي؟", answer:"أنا وأخي"}

],

"أكمل الأغنية":[

{q:"أنا وأخي ...", answer:"شقيقي"},
{q:"هزيم الرعد ...", answer:"البرق"},
{q:"في دربنا ...", answer:"سعينا"},
{q:"قد لاح فجر ...", answer:"جديد"},
{q:"نحمي الأرض ...", answer:"بشجاعة"}

]

};

// المتغيرات

let currentCategory = "";
let currentQuestion = 0;

// شاشة الفئات

function goCategories(){

    let t1 = document.getElementById("team1").value;
    let t2 = document.getElementById("team2").value;

    if(t1 == "" || t2 == ""){

        alert("اكتب أسماء الفرق");
        return;

    }

    let html = `

    <h1>🔥 لوحة التحدي 🔥</h1>

    <div class="board">

        <div class="team-box">

            <h2>${t1}</h2>

            <button class="question-btn"
            onclick="selectCategory('أرقام لاعبين')">
            ⚽ أرقام لاعبين - 100
            </button>

            <button class="question-btn"
            onclick="selectCategory('أسماء لاعبين')">
            ⚽ أسماء لاعبين - 200
            </button>

            <button class="question-btn"
            onclick="selectCategory('أغاني سبيستون')">
            🌟 أغاني سبيستون - 300
            </button>

            <button class="question-btn"
            onclick="selectCategory('ناروتو')">
            🍥 ناروتو - 400
            </button>

            <button class="question-btn"
            onclick="selectCategory('قصص أنبياء')">
            🕌 قصص أنبياء - 500
            </button>

        </div>

        <div class="team-box">

            <h2>${t2}</h2>

            <button class="question-btn"
            onclick="selectCategory('القرآن الكريم')">
            📖 القرآن الكريم - 100
            </button>

            <button class="question-btn"
            onclick="selectCategory('السيرة النبوية')">
            ☪️ السيرة النبوية - 200
            </button>

            <button class="question-btn"
            onclick="selectCategory('شارات سبيستون')">
            🎵 شارات سبيستون - 300
            </button>

            <button class="question-btn"
            onclick="selectCategory('أكمل الأغنية')">
            🎤 أكمل الأغنية - 400
            </button>

            <button class="question-btn"
            onclick="selectCategory('إسلامي عام')">
            🕋 إسلامي عام - 500
            </button>

        </div>

    </div>

    `;

    document.getElementById("categoryScreen").innerHTML = html;

    showScreen("categoryScreen");

}

// اختيار الفئة

function selectCategory(category){

    currentCategory = category;

    currentQuestion = 0;

    showQuestion();

}

// عرض السؤال

function showQuestion(){

    let q = questions[currentCategory][currentQuestion];

    document.getElementById("gameScreen").innerHTML = `

        <h1>${currentCategory}</h1>

        <h2>${q.q}</h2>

        <button onclick="showAnswer()">
            إظهار الإجابة
        </button>

        <div id="answerBox"></div>

    `;

    showScreen("gameScreen");

}

// إظهار الإجابة

function showAnswer(){

    let q = questions[currentCategory][currentQuestion];

    document.getElementById("answerBox").innerHTML = `

        <h2>✅ الإجابة:</h2>

        <h1>${q.answer}</h1>

        <button onclick="nextQuestion()">
            السؤال التالي
        </button>

    `;

}

// السؤال التالي

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion < questions[currentCategory].length){

        showQuestion();

    }else{

        alert("🎉 خلصت الفئة");

        goCategories();

    }

}

</script>

</body>
</html>
