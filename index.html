<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الطحن</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  direction: rtl;
  background: #111;
  color: white;
}

.screen { display: none; padding: 20px; }

.active { display: block; }

button {
  padding: 15px 25px;
  margin: 10px;
  font-size: 18px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
}

.big {
  font-size: 24px;
  background: red;
  color: white;
}

input {
  padding: 10px;
  margin: 10px;
  font-size: 16px;
}

.card {
  background: #333;
  padding: 20px;
  margin: 10px;
  display: inline-block;
  width: 120px;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- شاشة البداية -->
<div id="startScreen" class="screen active">
  <h1>🔥 لعبة الطحن 🔥</h1>
  <button class="big" onclick="goToTeams()">ابدأ الطحن</button>
</div>

<!-- شاشة الفرق -->
<div id="teamScreen" class="screen">
  <h2>أدخل أسماء الفرق</h2>
  <input id="team1" placeholder="اسم الفريق الأول"><br>
  <input id="team2" placeholder="اسم الفريق الثاني"><br>
  <button onclick="goToCategories()">متابعة</button>
</div>

<!-- شاشة الفئات -->
<div id="categoryScreen" class="screen">
  <h2>اختر الفئة</h2>

  <div class="card" onclick="startGame('رياضة')">رياضة</div>
  <div class="card" onclick="startGame('علوم')">علوم</div>
  <div class="card" onclick="startGame('تاريخ')">تاريخ</div>
  <div class="card" onclick="startGame('ترفيه')">ترفيه</div>
</div>

<script>
function show(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
}

function goToTeams() {
  show('teamScreen');
}

function goToCategories() {
  let t1 = document.getElementById('team1').value;
  let t2 = document.getElementById('team2').value;

  if(!t1 || !t2){
    alert("اكتب أسماء الفرق");
    return;
  }

  show('categoryScreen');
}

function startGame(category) {
  alert("بدأت الفئة: " + category);
}
</script>

</body>
</html>
