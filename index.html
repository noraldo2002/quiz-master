
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quiz Master</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #0f172a;
    color: white;
    margin: 0;
}

/* Loading */
#loading {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    animation: fadeOut 2s forwards;
}

@keyframes fadeOut {
    0% {opacity:1;}
    100% {opacity:0; visibility:hidden;}
}

/* Start Screen */
#startScreen {
    margin-top: 120px;
    animation: pop 0.8s ease;
}

@keyframes pop {
    from {transform: scale(0.5); opacity:0;}
    to {transform: scale(1); opacity:1;}
}

button {
    padding: 12px;
    margin: 5px;
    width: 80%;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

.startBtn {
    background: #22c55e;
    color: white;
    font-size: 22px;
}

.category { background: #2563eb; color: white; }
.option { background: #1e293b; color: white; }

#box { margin-top: 50px; }

</style>
</head>

<body>

<!-- 🔥 Loading -->
<div id="loading">Loading Quiz...</div>

<!-- 🎮 Start Screen -->
<div id="startScreen" style="display:none;">
    <h1>🎮 Quiz Master</h1>
    <button class="startBtn" onclick="showMenu()">ابدأ اللعب</button>
</div>

<div id="box">

<!-- Menu -->
<div id="menu" style="display:none;">
    <button class="category" onclick="startQuiz('general')">معلومات عامة</button>
    <button class="category" onclick="startQuiz('science')">علوم</button>
    <button class="category" onclick="startQuiz('sports')">رياضة</button>
</div>

<!-- Quiz -->
<div id="quiz" style="display:none;">
    <h3 id="question"></h3>

    <button class="option" onclick="answer('A')" id="A"></button>
    <button class="option" onclick="answer('B')" id="B"></button>
    <button class="option" onclick="answer('C')" id="C"></button>
    <button class="option" onclick="answer('D')" id="D"></button>

    <p>⏱ الوقت: <span id="time">15</span></p>
    <p>⭐ النقاط: <span id="score">0</span></p>
</div>

<!-- Result -->
<div id="result" style="display:none;">
    <h2>انتهت اللعبة 🎉</h2>
    <p>نتيجتك: <span id="finalScore"></span></p>
    <button onclick="location.reload()">إعادة اللعب</button>
</div>

</div>

<script>

/* 🎵 صوت بسيط */
function playSound(){
    let audio = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
    audio.play();
}

/* بعد التحميل */
setTimeout(()=>{
    document.getElementById("loading").style.display="none";
    document.getElementById("startScreen").style.display="block";
},2000);

/* Start Screen */
function showMenu(){
    playSound();
    document.getElementById("startScreen").style.display="none";
    document.getElementById("menu").style.display="block";
}

/* Data */
let data = {
 general: [
  {q:"ما عاصمة الأردن؟", a:"عمان", b:"دمشق", c:"بيروت", d:"بغداد", correct:"A"},
  {q:"كم قارة بالعالم؟", a:"5", b:"6", c:"7", d:"8", correct:"C"},
  {q:"عملة الأردن؟", a:"دينار", b:"دولار", c:"يورو", d:"ريال", correct:"A"}
 ],

 science: [
  {q:"أكبر كوكب؟", a:"الأرض", b:"المريخ", c:"المشتري", d:"الزهرة", correct:"C"},
  {q:"وحدة القوة؟", a:"نيوتن", b:"جول", c:"واط", d:"أمبير", correct:"A"},
  {q:"عدد الكواكب؟", a:"7", b:"8", c:"9", d:"10", correct:"B"}
 ],

 sports: [
  {q:"لاعبين كرة القدم؟", a:"9", b:"10", c:"11", d:"12", correct:"C"},
  {q:"كم شوط؟", a:"1", b:"2", c:"3", d:"4", correct:"B"},
  {q:"مدة المباراة؟", a:"90", b:"80", c:"100", d:"70", correct:"A"}
 ]
};

let current = 0;
let score = 0;
let questions = [];
let timer;
let timeLeft = 15;

/* Quiz */
function startQuiz(cat){
 playSound();
 document.getElementById("menu").style.display="none";
 document.getElementById("quiz").style.display="block";

 questions = data[cat];
 current = 0;
 score = 0;

 loadQuestion();
 startTimer();
}

function loadQuestion(){
 let q = questions[current];

 document.getElementById("question").innerText = q.q;
 document.getElementById("A").innerText = q.a;
 document.getElementById("B").innerText = q.b;
 document.getElementById("C").innerText = q.c;
 document.getElementById("D").innerText = q.d;

 timeLeft = 15;
 document.getElementById("time").innerText = timeLeft;
}

function answer(choice){
 let q = questions[current];

 if(choice == q.correct){
  score += 10;
  document.getElementById("score").innerText = score;
 }

 current++;

 if(current >= questions.length){
  endGame();
 } else {
  loadQuestion();
 }
}

function startTimer(){
 clearInterval(timer);

 timer = setInterval(()=>{
  timeLeft--;
  document.getElementById("time").innerText = timeLeft;

  if(timeLeft <= 0){
    current++;
    if(current >= questions.length){
      endGame();
    } else {
      loadQuestion();
    }
    timeLeft = 15;
  }
 },1000);
}

function endGame(){
 clearInterval(timer);
 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("finalScore").innerText = score;
}

</script>

</body>
</html>
