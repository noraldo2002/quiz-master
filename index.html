<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة كرة القدم</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  direction: rtl;
  background: #111;
  color: white;
}

.screen { display: none; padding: 20px; }
.active { display: block; }

button {
  padding: 12px 20px;
  margin: 10px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

.big {
  font-size: 24px;
  background: red;
  color: white;
}

.card {
  background: #333;
  padding: 20px;
  margin: 10px;
  display: inline-block;
  width: 150px;
  border-radius: 10px;
}
</style>

</head>

<body>

<!-- 🟢 البداية -->
<div id="startScreen" class="screen active">
  <h1>🔥 لعبة كرة القدم 🔥</h1>
  <button class="big" onclick="goTeams()">ابدأ الطحن</button>
</div>

<!-- 🟡 الفرق -->
<div id="teamScreen" class="screen">
  <h2>أدخل أسماء الفرق</h2>
  <input id="t1" placeholder="الفريق الأول"><br>
  <input id="t2" placeholder="الفريق الثاني"><br>
  <button onclick="goCategories()">متابعة</button>
</div>

<!-- 🔵 الفئات -->
<div id="categoryScreen" class="screen">
  <h1>⚽ كرة القدم</h1>

  <div class="card" onclick="selectCat('أرقام لاعبين')">أرقام لاعبين</div>
  <div class="card" onclick="selectCat('أسماء لاعبين')">أسماء لاعبين</div>
  <div class="card" onclick="selectCat('كرة قدم عالمية')">كرة عالمية</div>
  <div class="card" onclick="selectCat('من هو اللاعب')">من هو اللاعب</div>
</div>

<!-- 🟣 السؤال -->
<div id="gameScreen" class="screen"></div>

<script>

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 🟢 الانتقال
function goTeams(){ show('teamScreen'); }

function goCategories(){
  if(!t1.value || !t2.value){
    alert("اكتب أسماء الفرق");
    return;
  }
  show('categoryScreen');
}

// ⚽ الأسئلة الحقيقية
let data = {
  "أرقام لاعبين": [
    {q:"رقم ميسي؟", a:["7","10","9","11"], c:1},
    {q:"رقم رونالدو؟", a:["7","10","11","9"], c:0}
  ],
  "أسماء لاعبين": [
    {q:"صاحب رقم 10 الأرجنتين؟", a:["ميسي","رونالدو","نيمار","صلاح"], c:0}
  ],
  "كرة قدم عالمية": [
    {q:"كأس العالم 2022؟", a:["قطر","البرازيل","ألمانيا","فرنسا"], c:0}
  ],
  "من هو اللاعب": [
    {q:"الدون؟", a:["رونالدو","ميسي","نيمار","صلاح"], c:0}
  ]
};

let cat = "";
let i = 0;

function selectCat(c){
  cat = c;
  i = 0;
  showGame();
}

function showGame(){
  let q = data[cat][i];

  document.getElementById("gameScreen").innerHTML = `
    <h2>${cat}</h2>
    <h3>${q.q}</h3>
    ${q.a.map((x, idx)=>`
      <button onclick="answer(${idx})">${x}</button>
    `).join("")}
  `;

  show('gameScreen');
}

function answer(x){
  let q = data[cat][i];

  alert(x === q.c ? "صح ✔️" : "غلط ❌");

  i++;

  if(i < data[cat].length){
    showGame();
  } else {
    alert("خلصت الفئة");
    show('categoryScreen');
  }
}

</script>

</body>
</html>
