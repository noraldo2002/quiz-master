<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 لعبة التحدي 🔥</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    direction:rtl;
    text-align:center;
}

.screen{display:none;padding:20px;}
.active{display:block;}

button{
    padding:15px 25px;
    margin:10px;
    border:none;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
}

.start-btn{background:red;color:white;font-size:30px;}

input{
    padding:12px;
    width:250px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

.jeopardy-board{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-top:20px;
}

.column{background:#1b1b1b;padding:10px;border-radius:15px;}

.category-title{
    background:#ff9800;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

.point-btn{
    width:100%;
    background:#1565c0;
    color:white;
    font-size:28px;
}

.point-btn:disabled{background:#333;}

.scoreboard{
    display:flex;
    justify-content:space-around;
    font-size:26px;
    background:#222;
    padding:15px;
    border-radius:15px;
}
</style>
</head>

<body>

<div id="startScreen" class="screen active">
<h1>🔥 لعبة التحدي 🔥</h1>
<button class="start-btn" onclick="goTeams()">ابدأ اللعبة</button>
</div>

<div id="teamScreen" class="screen">
<h1>⚔️ أدخل أسماء الفرق</h1>
<input id="team1" placeholder="الفريق الأول"><br>
<input id="team2" placeholder="الفريق الثاني"><br>
<button onclick="goCategories()">متابعة</button>
</div>

<div id="categoryScreen" class="screen"></div>
<div id="gameScreen" class="screen"></div>

<script>

function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function goTeams(){showScreen('teamScreen');}

let team1Name="", team2Name="";
let score1=0, score2=0;

let currentCategory="";
let currentQuestion=0;

let usedQuestions={};

// 🔥 الفئات الجديدة + القديمة
let questions={

"جزء تبارك":[
{q:"كم عدد سور جزء تبارك؟",answer:"11"},
{q:"ما أول سورة في جزء تبارك؟",answer:"الملك"},
{q:"ما آخر سورة؟",answer:"المرسلات"}
],

"قصص انبياء":[
{q:"من النبي الذي ابتلعه الحوت؟",answer:"يونس"},
{q:"من كلم الله؟",answer:"موسى"},
{q:"من بنى السفينة؟",answer:"نوح"}
],

"من هو اللاعب":[
{q:"من هو اللاعب رقم 7 الشهير؟",answer:"كريستيانو رونالدو"},
{q:"من هو ميسي؟",answer:"لاعب أرجنتيني"},
{q:"من هو مبابي؟",answer:"لاعب فرنسي"}
],

"معلومات عامة":[
{q:"ما عاصمة الأردن؟",answer:"عمان"},
{q:"كم قارة؟",answer:"7"},
{q:"أكبر محيط؟",answer:"الهادئ"}
],

"رتب الحروف":[
{q:"رتب: ل م ع",answer:"علم"},
{q:"رتب: ك ب ت",answer:"كتب"},
{q:"رتب: ر د ن",answer:"نرد"}
],

"الولادة من الخاصرة":[
{q:"نوع العمل؟",answer:"مسلسل"},
{q:"بطل العمل؟",answer:"تيم حسن"},
{q:"سنة العرض؟",answer:"2011"}
],

"اكلات تقليدية":[
{q:"ما هو المنسف؟",answer:"طبق أردني"},
{q:"ما هو الفلافل؟",answer:"أكلة من الحمص"},
{q:"ما هي المقلوبة؟",answer:"رز وخضار"}
],

"اعلام":[
{q:"علم الأردن ألوانه؟",answer:"أسود أبيض أخضر أحمر"},
{q:"علم فلسطين؟",answer:"أسود أبيض أخضر أحمر"},
{q:"علم مصر فيه؟",answer:"أحمر أبيض أسود"}
]

};

// 📌 الفرق
function goCategories(){

team1Name=document.getElementById("team1").value;
team2Name=document.getElementById("team2").value;

if(!team1Name||!team2Name){
alert("اكتب أسماء الفرق");
return;
}

let cats=Object.keys(questions);

let html=`
<div class="scoreboard">
<div>🔴 ${team1Name}: ${score1}</div>
<div>🔵 ${team2Name}: ${score2}</div>
</div>

<h1>🔥 اللوحة 🔥</h1>
<div class="jeopardy-board">
`;

cats.forEach(cat=>{
html+=`<div class="column"><div class="category-title">${cat}</div>`;

for(let i=0;i<questions[cat].length;i++){
html+=`
<button class="point-btn"
onclick="openQuestion('${cat}',${i},this)">
${(i+1)*100}
</button>`;
}

html+=`</div>`;
});

html+=`</div>`;

document.getElementById("categoryScreen").innerHTML=html;
showScreen("categoryScreen");
}

function openQuestion(cat,index,btn){

if(!usedQuestions[cat])usedQuestions[cat]=[];

if(usedQuestions[cat].includes(index)){
alert("هذا السؤال تم حله");
return;
}

usedQuestions[cat].push(index);

currentCategory=cat;
currentQuestion=index;

btn.disabled=true;

showQuestion();
}

function showQuestion(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("gameScreen").innerHTML=`
<h1>${currentCategory}</h1>
<h2>${q.q}</h2>

<button onclick="showAnswer()">إظهار الإجابة</button>
<button onclick="showScreen('categoryScreen')">رجوع</button>

<div id="ans"></div>
`;

showScreen("gameScreen");
}

function showAnswer(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("ans").innerHTML=`
<h2>${q.answer}</h2>

<button onclick="addScore(1)">🔴 ${team1Name}</button>
<button onclick="addScore(2)">🔵 ${team2Name}</button>
`;
}

function addScore(team){

let q=currentQuestion;
let points=(q+1)*100;

if(team==1)score1+=points;
else score2+=points;

showScreen("categoryScreen");
}

</script>

</body>
</html>
