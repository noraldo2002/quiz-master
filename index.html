<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 لعبة التحدي 🔥</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    direction:rtl;
    text-align:center;
}

.screen{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

button{
    padding:12px 18px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.start-btn{
    background:red;
    color:white;
    font-size:28px;
}

input{
    padding:10px;
    width:250px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

.jeopardy-board{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:20px;
}

.column{
    background:#1b1b1b;
    padding:10px;
    border-radius:15px;
}

.category-title{
    background:#ff9800;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

.point-btn{
    width:100%;
    background:#1565c0;
    color:white;
    font-size:18px;
}

.point-btn:disabled{
    background:#333;
}

.scoreboard{
    display:flex;
    justify-content:space-around;
    font-size:22px;
    background:#222;
    padding:15px;
    border-radius:15px;
}

#timer{
    font-size:32px;
    color:yellow;
    margin:15px;
}

.end-btn{
    background:red;
    color:white;
    font-size:22px;
    margin-top:15px;
}

</style>
</head>

<body>

<!-- البداية -->
<div id="startScreen" class="screen active">

<h1>🔥 لعبة التحدي 🔥</h1>

<button class="start-btn" onclick="showScreen('teamScreen')">
ابدأ اللعبة
</button>

</div>

<!-- الفرق -->
<div id="teamScreen" class="screen">

<h1>⚔️ أدخل أسماء الفرق</h1>

<input id="team1" placeholder="الفريق الأول"><br>

<input id="team2" placeholder="الفريق الثاني"><br>

<button onclick="showScreen('categorySelectScreen')">
متابعة
</button>

</div>

<!-- اختيار الفئات -->
<div id="categorySelectScreen" class="screen"></div>

<!-- لوحة اللعبة -->
<div id="categoryScreen" class="screen"></div>

<!-- السؤال -->
<div id="gameScreen" class="screen"></div>

<!-- النهاية -->
<div id="endScreen" class="screen"></div>

<script>

window.speechSynthesis.onvoiceschanged = () => {};

let team1Name="";
let team2Name="";

let score1=0;
let score2=0;

let selectedCategories=[];
let usedQuestions={};

let currentCategory="";
let currentQuestion=0;
let currentPoints=0;

let timer;
let time=0;

// =====================
// الأسئلة
// =====================

let questions = {

"معلومات عامة":[
{q:"ما عاصمة الأردن؟",answer:"عمان"},
{q:"كم قارة؟",answer:"7"},
{q:"أكبر محيط؟",answer:"الهادئ"}
],

"قصص انبياء":[
{q:"من ابتلعه الحوت؟",answer:"يونس"},
{q:"من كلم الله؟",answer:"موسى"},
{q:"من بنى السفينة؟",answer:"نوح"}
],

"جزء تبارك":[
{q:"عدد السور؟",answer:"11"},
{q:"أول سورة؟",answer:"الملك"},
{q:"آخر سورة؟",answer:"المرسلات"}
],

"رتب الحروف":[
{q:"ل م ع",answer:"علم"},
{q:"ك ت ب",answer:"كتب"},
{q:"ر د ن",answer:"نرد"}
],

"من هو اللاعب":[
{q:"رقم 7؟",answer:"رونالدو"},
{q:"ميسي؟",answer:"لاعب أرجنتيني"},
{q:"مبابي؟",answer:"لاعب فرنسي"}
],

"أكلات":[
{q:"المنسف؟",answer:"طبق أردني"},
{q:"الفلافل؟",answer:"حمص"},
{q:"المقلوبة؟",answer:"رز وخضار"}
],

"اعلام":[
{q:"علم الأردن؟",answer:"أسود أبيض أخضر أحمر"},
{q:"علم فلسطين؟",answer:"نفس الألوان"},
{q:"علم مصر؟",answer:"أحمر أبيض أسود"}
],

"مسلسلات":[
{q:"الولادة من الخاصرة؟",answer:"مسلسل"},
{q:"البطل؟",answer:"تيم حسن"},
{q:"السنة؟",answer:"2011"}
]

};

// =====================
// تغيير الشاشة
// =====================

function showScreen(id){

document.querySelectorAll('.screen').forEach(s=>{
s.classList.remove('active');
});

document.getElementById(id).classList.add('active');

}

// =====================
// اختيار الفئات
// =====================

let cats=Object.keys(questions);

let html="<h2>📚 اختر الفئات (2 أو 4 أو 6 فقط)</h2>";

cats.forEach(cat=>{
html+=`
<button onclick="toggleCategory(this,'${cat}')">${cat}</button>
`;
});

html+=`
<br>
<button onclick="startGame()">ابدأ اللعب</button>
`;

document.getElementById("categorySelectScreen").innerHTML=html;

function toggleCategory(btn,cat){

if(selectedCategories.includes(cat)){
selectedCategories=selectedCategories.filter(c=>c!==cat);
btn.style.background="";
}else{

if(selectedCategories.length>=6){
alert("الحد الأقصى 6 فئات");
return;
}

selectedCategories.push(cat);
btn.style.background="green";
}

}

// =====================
// بدء اللعبة
// =====================

function startGame(){

if(
selectedCategories.length!==2 &&
selectedCategories.length!==4 &&
selectedCategories.length!==6
){
alert("لازم تختار 2 أو 4 أو 6 فئات فقط");
return;
}

team1Name=document.getElementById("team1").value.trim();
team2Name=document.getElementById("team2").value.trim();

if(!team1Name || !team2Name){
alert("اكتب أسماء الفرق");
return;
}

goCategories();

}

// =====================
// لوحة اللعبة
// =====================

function goCategories(){

let html=`

<div class="scoreboard">

<div>🔴 ${team1Name}: ${score1}</div>
<div>🔵 ${team2Name}: ${score2}</div>

</div>

<button class="end-btn" onclick="showEnd()">🏁 إنهاء اللعبة</button>

<div class="jeopardy-board">

`;

selectedCategories.forEach(cat=>{

html+=`

<div class="column">

<div class="category-title">${cat}</div>

`;

for(let i=0;i<questions[cat].length;i++){

let points=(i+1)*100;

html+=`

<button class="point-btn"
onclick="openQuestion('${cat}',${i},${points},this)">
${points}
</button>

`;

}

html+=`</div>`;

});

html+=`</div>`;

document.getElementById("categoryScreen").innerHTML=html;

showScreen("categoryScreen");

}

// =====================
// فتح السؤال
// =====================

function openQuestion(cat,index,points,btn){

if(!usedQuestions[cat]){
usedQuestions[cat]=[];
}

if(usedQuestions[cat].includes(index)) return;

usedQuestions[cat].push(index);

currentCategory=cat;
currentQuestion=index;
currentPoints=points;

btn.disabled=true;

startTimer();
showQuestion();

}

// =====================
// التايمر
// =====================

function startTimer(){

clearInterval(timer);

time=0;

timer=setInterval(()=>{

time++;

let t=document.getElementById("timer");
if(t) t.innerText="⏱️ "+time;

},1000);

}

function resetTimer(){

clearInterval(timer);
time=0;
document.getElementById("timer").innerText="⏱️ 0";
startTimer();

}

// =====================
// صوت السؤال (إصلاح الإنجليزي)
// =====================

function speakQuestion(text){

let voices = window.speechSynthesis.getVoices();

let arabicVoice = voices.find(v => v.lang.includes("ar"));

let speech = new SpeechSynthesisUtterance(text);

speech.lang = "ar-SA";

if(arabicVoice){
speech.voice = arabicVoice;
}

speech.rate = 0.9;

window.speechSynthesis.cancel();
window.speechSynthesis.speak(speech);

}

// =====================
// عرض السؤال
// =====================

function showQuestion(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("gameScreen").innerHTML=`

<div id="timer">⏱️ 0</div>

<button onclick="resetTimer()">🔄 إعادة الوقت</button>

<h2>${currentCategory}</h2>

<h3>${q.q}</h3>

<button onclick="showAnswer()">إظهار الإجابة</button>

<button onclick="showScreen('categoryScreen')">رجوع</button>

<div id="ans"></div>

`;

showScreen("gameScreen");

speakQuestion(q.q);

}

// =====================
// عرض الإجابة
// =====================

function showAnswer(){

clearInterval(timer);

let q=questions[currentCategory][currentQuestion];

document.getElementById("ans").innerHTML=`

<h2>${q.answer}</h2>

<h3>مين جاوب صح؟</h3>

<button onclick="addScore(1)">🔴 ${team1Name}</button>
<button onclick="addScore(2)">🔵 ${team2Name}</button>
<button onclick="noAnswer()">❌ ولا حد</button>

`;

}

// =====================
// النقاط
// =====================

function addScore(team){

clearInterval(timer);

if(team===1) score1+=currentPoints;
else score2+=currentPoints;

updateScoreUI();
checkEnd();
showScreen("categoryScreen");

}

// =====================
// ولا حد
// =====================

function noAnswer(){
showScreen("categoryScreen");
checkEnd();
}

// =====================
// تحديث
// =====================

function updateScoreUI(){

let b=document.querySelector(".scoreboard");

if(b){

b.innerHTML=`
<div>🔴 ${team1Name}: ${score1}</div>
<div>🔵 ${team2Name}: ${score2}</div>
`;

}

}

// =====================
// النهاية
// =====================

function checkEnd(){

let total=0;
let done=0;

selectedCategories.forEach(cat=>{
total+=questions[cat].length;
if(usedQuestions[cat]) done+=usedQuestions[cat].length;
});

if(done>=total) showEnd();

}

// =====================
// إنهاء
// =====================

function showEnd(){

clearInterval(timer);
window.speechSynthesis.cancel();

let winner="تعادل";

if(score1>score2) winner="🔴 "+team1Name;
else if(score2>score1) winner="🔵 "+team2Name;

document.getElementById("endScreen").innerHTML=`

<h1>🏆 انتهت اللعبة</h1>

<h2>الفائز: ${winner}</h2>

<p>🔴 ${team1Name}: ${score1}</p>
<p>🔵 ${team2Name}: ${score2}</p>

<button onclick="goHome()">🏠 العودة</button>

`;

showScreen("endScreen");

}

// =====================
// رجوع
// =====================

function goHome(){

score1=0;
score2=0;

selectedCategories=[];
usedQuestions={};

team1Name="";
team2Name="";

clearInterval(timer);
window.speechSynthesis.cancel();

document.getElementById("team1").value="";
document.getElementById("team2").value="";

document.querySelectorAll("#categorySelectScreen button").forEach(b=>{
b.style.background="";
});

showScreen("startScreen");

}

</script>

</body>
</html>
