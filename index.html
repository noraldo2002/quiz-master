<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الكويز</title>
<style>
body { font-family: Arial; direction: rtl; background:#111; color:white; text-align:center; }
button { padding:10px; margin:5px; cursor:pointer; }
.container { margin-top:50px; }
.hidden { display:none; }
</style>
</head>
<body>

<div id="teamsPage" class="container">
  <h2>ادخل أسماء الفرق</h2>
  <input id="team1" placeholder="الفريق الأول"><br><br>
  <input id="team2" placeholder="الفريق الثاني"><br><br>
  <button onclick="goCategories()">التالي</button>
</div>

<div id="categoriesPage" class="container hidden">
  <h2>اختر الفئة</h2>
  <div id="categories"></div>
</div>

<div id="gamePage" class="container hidden">
  <h2 id="categoryTitle"></h2>
  <h3>السؤال:</h3>
  <p id="question">اضغط لبدء السؤال</p>
  <button onclick="nextQuestion()">سؤال التالي</button>
</div>

<script>

let categories = [
  "معلومات عامة",
  "رتب الحروف",
  "اسلامي عام",
  "قصص الانبياء",
  "جزء تبارك",
  "السيرة النبوية",
  "اغاني سبيستون",
  "ناروتو",
  "من هو اللاعب",
  "كرة قدم عالمية",
  "رقم اللاعب",
  "الولادة من الخاصرة",
  "باب الحارة",
  "تشريح"
];

let questions = {
  "معلومات عامة": ["سؤال 1", "سؤال 2"],
  "رتب الحروف": ["سؤال 1"],
  "اسلامي عام": ["سؤال 1"],
  "قصص الانبياء": ["سؤال 1"],
  "جزء تبارك": ["سؤال 1"],
  "السيرة النبوية": ["سؤال 1"],
  "اغاني سبيستون": ["سؤال 1"],
  "ناروتو": ["سؤال 1"],
  "من هو اللاعب": ["سؤال 1"],
  "كرة قدم عالمية": ["سؤال 1"],
  "رقم اللاعب": ["سؤال 1"],
  "الولادة من الخاصرة": ["سؤال 1"],
  "باب الحارة": ["سؤال 1"],
  "تشريح": ["سؤال 1"]
};

let selectedCategory = "";
let qIndex = 0;

function goCategories(){
  document.getElementById("teamsPage").classList.add("hidden");
  document.getElementById("categoriesPage").classList.remove("hidden");

  let catDiv = document.getElementById("categories");
  catDiv.innerHTML = "";

  categories.forEach(cat=>{
    let btn = document.createElement("button");
    btn.innerText = cat;
    btn.onclick = ()=>startGame(cat);
    catDiv.appendChild(btn);
  });
}

function startGame(cat){
  selectedCategory = cat;
  qIndex = 0;

  document.getElementById("categoriesPage").classList.add("hidden");
  document.getElementById("gamePage").classList.remove("hidden");

  document.getElementById("categoryTitle").innerText = cat;
  document.getElementById("question").innerText = "جاهز؟ اضغط سؤال التالي";
}

function nextQuestion(){
  let qs = questions[selectedCategory];
  if(qIndex < qs.length){
    document.getElementById("question").innerText = qs[qIndex];
    qIndex++;
  } else {
    document.getElementById("question").innerText = "خلصت الأسئلة 🔥";
  }
}

</script>

</body>
</html>
