<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 لعبة التحدي 🔥</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    direction:rtl;
    text-align:center;
}

.screen{display:none;padding:20px;}
.active{display:block;}

button{
    padding:12px 18px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.start-btn{background:red;color:white;font-size:28px;}

input{
    padding:10px;
    width:250px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

.jeopardy-board{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-top:20px;
}

.column{
    background:#1b1b1b;
    padding:10px;
    border-radius:15px;
}

.category-title{
    background:#ff9800;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.point-btn{
    width:100%;
    background:#1565c0;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.point-btn:disabled{
    background:#333;
}

.scoreboard{
    display:flex;
    justify-content:space-around;
    font-size:24px;
    background:#222;
    padding:15px;
    border-radius:15px;
}

</style>

</head>

<body>

<!-- البداية -->
<div id="startScreen" class="screen active">
<h1>🔥 لعبة التحدي 🔥</h1>
<button class="start-btn" onclick="showScreen('teamScreen')">ابدأ اللعبة</button>
</div>

<!-- الفرق -->
<div id="teamScreen" class="screen">
<h1>⚔️ أدخل أسماء الفرق</h1>
<input id="team1" placeholder="الفريق الأول"><br>
<input id="team2" placeholder="الفريق الثاني"><br>
<button onclick="goCategorySelect()">متابعة</button>
</div>

<!-- اختيار الفئات -->
<div id="categorySelectScreen" class="screen"></div>

<!-- لوحة اللعب -->
<div id="categoryScreen" class="screen"></div>

<!-- السؤال -->
<div id="gameScreen" class="screen"></div>

<script>

// ====== المتغيرات ======
let team1Name="", team2Name="";
let score1=0, score2=0;

let selectedCategories=[];
let usedQuestions={};

let currentCategory="";
let currentQuestion=0;
let currentPoints=0;

// ====== الأسئلة ======
let questions={

"جزء تبارك":[
{q:"كم عدد سور جزء تبارك؟",answer:"11"},
{q:"ما أول سورة في جزء تبارك؟",answer:"الملك"},
{q:"ما آخر سورة؟",answer:"المرسلات"}
],

"قصص انبياء":[
{q:"من النبي الذي ابتلعه الحوت؟",answer:"يونس"},
{q:"من كلم الله؟",answer:"موسى"},
{q:"من بنى السفينة؟",answer:"نوح"}
],

"من هو اللاعب":[
{q:"من هو اللاعب رقم 7 الشهير؟",answer:"كريستيانو رونالدو"},
{q:"من هو ميسي؟",answer:"لاعب أرجنتيني"},
{q:"من هو مبابي؟",answer:"لاعب فرنسي"}
],

"معلومات عامة":[
{q:"ما عاصمة الأردن؟",answer:"عمان"},
{q:"كم قارة؟",answer:"7"},
{q:"أكبر محيط؟",answer:"الهادئ"}
],

"رتب الحروف":[
{q:"رتب: ل م ع",answer:"علم"},
{q:"رتب: ك ب ت",answer:"كتب"},
{q:"رتب: ر د ن",answer:"نرد"}
],

"الولادة من الخاصرة":[
{q:"نوع العمل؟",answer:"مسلسل"},
{q:"بطل العمل؟",answer:"تيم حسن"},
{q:"سنة العرض؟",answer:"2011"}
],

"اكلات تقليدية":[
{q:"ما هو المنسف؟",answer:"طبق أردني"},
{q:"ما هو الفلافل؟",answer:"أكلة من الحمص"},
{q:"ما هي المقلوبة؟",answer:"رز وخضار"}
],

"اعلام":[
{q:"علم الأردن ألوانه؟",answer:"أسود أبيض أخضر أحمر"},
{q:"علم فلسطين؟",answer:"أسود أبيض أخضر أحمر"},
{q:"علم مصر فيه؟",answer:"أحمر أبيض أسود"}
]

};

// ====== عرض شاشة ======
function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// ====== اختيار الفئات ======
function goCategorySelect(){

team1Name=document.getElementById("team1").value;
team2Name=document.getElementById("team2").value;

if(!team1Name||!team2Name){
alert("اكتب أسماء الفرق");
return;
}

let cats=Object.keys(questions);

let html="<h1>اختار الفئات</h1>";

cats.forEach(cat=>{
html+=`<button onclick="toggleCategory(this,'${cat}')">${cat}</button>`;
});

html+=`<br><button onclick="startGame()">ابدأ اللعبة</button>`;

document.getElementById("categorySelectScreen").innerHTML=html;

showScreen("categorySelectScreen");
}

// ====== اختيار/إلغاء فئة ======
function toggleCategory(btn,cat){

if(selectedCategories.includes(cat)){
selectedCategories=selectedCategories.filter(c=>c!==cat);
btn.style.background="";
}else{
selectedCategories.push(cat);
btn.style.background="green";
}

}

// ====== بدء اللعبة ======
function startGame(){

if(selectedCategories.length==0){
alert("اختار فئات");
return;
}

goCategories();
}

// ====== لوحة اللعب ======
function goCategories(){

let html=`
<div class="scoreboard">
<div>🔴 ${team1Name}: ${score1}</div>
<div>🔵 ${team2Name}: ${score2}</div>
</div>

<h1>🔥 لوحة التحدي 🔥</h1>

<div class="jeopardy-board">
`;

selectedCategories.forEach(cat=>{

html+=`<div class="column">
<div class="category-title">${cat}</div>`;

for(let i=0;i<questions[cat].length;i++){

let points=(i+1)*100;

html+=`
<button class="point-btn"
onclick="openQuestion('${cat}',${i},${points},this)">
${points}
</button>`;
}

html+=`</div>`;
});

html+=`</div>`;

document.getElementById("categoryScreen").innerHTML=html;

showScreen("categoryScreen");
}

// ====== فتح السؤال ======
function openQuestion(cat,index,points,btn){

if(!usedQuestions[cat])usedQuestions[cat]=[];

if(usedQuestions[cat].includes(index)){
alert("هذا السؤال تم حله");
return;
}

usedQuestions[cat].push(index);

currentCategory=cat;
currentQuestion=index;
currentPoints=points;

btn.disabled=true;

showQuestion();
}

// ====== عرض السؤال ======
function showQuestion(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("gameScreen").innerHTML=`
<h2>${currentCategory}</h2>
<h3>${q.q}</h3>

<button onclick="showAnswer()">إظهار الإجابة</button>
<button onclick="showScreen('categoryScreen')">رجوع</button>

<div id="ans"></div>
`;

showScreen("gameScreen");
}

// ====== عرض الإجابة ======
function showAnswer(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("ans").innerHTML=`
<h2>${q.answer}</h2>

<button onclick="addScore(1)">🔴 ${team1Name}</button>
<button onclick="addScore(2)">🔵 ${team2Name}</button>
`;
}

// ====== النقاط ======
function addScore(team){

if(team==1)score1+=currentPoints;
else score2+=currentPoints;

showScreen("categoryScreen");
}

</script>

</body>
</html>
