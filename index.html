<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 لعبة التحدي 🔥</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    direction:rtl;
    text-align:center;
}

.screen{display:none;padding:20px;}
.active{display:block;}

button{
    padding:12px 18px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.start-btn{background:red;color:white;font-size:28px;}

input{
    padding:10px;
    width:250px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

.jeopardy-board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.column{
    background:#1b1b1b;
    padding:10px;
    border-radius:15px;
}

.category-title{
    background:#ff9800;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

.point-btn{
    width:100%;
    background:#1565c0;
    color:white;
    font-size:18px;
}

.point-btn:disabled{background:#333;}

.scoreboard{
    display:flex;
    justify-content:space-around;
    font-size:22px;
    background:#222;
    padding:15px;
    border-radius:15px;
}

#timer{
    font-size:28px;
    color:yellow;
    margin:10px;
}
</style>
</head>

<body>

<!-- البداية -->
<div id="startScreen" class="screen active">
<h1>🔥 لعبة التحدي 🔥</h1>
<button class="start-btn" onclick="showScreen('teamScreen')">ابدأ اللعبة</button>
</div>

<!-- الفرق -->
<div id="teamScreen" class="screen">
<h1>⚔️ أدخل أسماء الفرق</h1>
<input id="team1" placeholder="الفريق الأول"><br>
<input id="team2" placeholder="الفريق الثاني"><br>
<button onclick="showScreen('categorySelectScreen')">متابعة</button>
</div>

<!-- الفئات -->
<div id="categorySelectScreen" class="screen"></div>

<!-- اللوحة -->
<div id="categoryScreen" class="screen"></div>

<!-- السؤال -->
<div id="gameScreen" class="screen"></div>

<!-- النهاية -->
<div id="endScreen" class="screen"></div>

<script>

let team1Name="", team2Name="";
let score1=0, score2=0;

let selectedCategories=[];
let usedQuestions={};

let currentCategory="";
let currentQuestion=0;
let currentPoints=0;

let timer;
let time=15;

// ===== الأسئلة =====
let questions={
"معلومات":[
{q:"ما عاصمة الأردن؟",answer:"عمان"},
{q:"كم قارة؟",answer:"7"}
],
"قصص":[
{q:"من النبي الذي ابتلعه الحوت؟",answer:"يونس"},
{q:"من كلم الله؟",answer:"موسى"}
],
"رتب":[
{q:"رتب: ل م ع",answer:"علم"},
{q:"رتب: ك ت ب",answer:"كتب"}
],
"عام":[
{q:"أكبر محيط؟",answer:"الهادئ"},
{q:"كم عدد أيام السنة؟",answer:"365"}
]
};

// ===== عرض شاشة =====
function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// ===== اختيار فئات =====
let cats=Object.keys(questions);

let html="<h2>اختار الفئات</h2>";

cats.forEach(cat=>{
html+=`<button onclick="toggleCategory(this,'${cat}')">${cat}</button>`;
});

html+=`<br><button onclick="startGame()">ابدأ اللعب</button>`;

document.getElementById("categorySelectScreen").innerHTML=html;

// ===== اختيار =====
function toggleCategory(btn,cat){

if(selectedCategories.includes(cat)){
selectedCategories=selectedCategories.filter(c=>c!==cat);
btn.style.background="";
}else{
selectedCategories.push(cat);
btn.style.background="green";
}
}

// ===== زر البداية (المهم) =====
function startGame(){

if(selectedCategories.length === 0){
alert("اختار فئة على الأقل");
return;
}

team1Name=document.getElementById("team1").value.trim();
team2Name=document.getElementById("team2").value.trim();

if(!team1Name || !team2Name){
alert("اكتب أسماء الفرق");
return;
}

goCategories();
}

// ===== لوحة =====
function goCategories(){

let html=`
<div class="scoreboard">
<div>🔴 ${team1Name}: ${score1}</div>
<div>🔵 ${team2Name}: ${score2}</div>
</div>

<div class="jeopardy-board">
`;

selectedCategories.forEach(cat=>{
html+=`<div class="column">
<div class="category-title">${cat}</div>`;

for(let i=0;i<questions[cat].length;i++){
let points=(i+1)*100;

html+=`
<button class="point-btn" onclick="openQuestion('${cat}',${i},${points},this)">
${points}
</button>`;
}

html+=`</div>`;
});

html+=`</div>`;

document.getElementById("categoryScreen").innerHTML=html;
showScreen("categoryScreen");
}

// ===== سؤال =====
function openQuestion(cat,index,points,btn){

if(!usedQuestions[cat])usedQuestions[cat]=[];

if(usedQuestions[cat].includes(index)) return;

usedQuestions[cat].push(index);

currentCategory=cat;
currentQuestion=index;
currentPoints=points;

btn.disabled=true;

startTimer();
showQuestion();
}

// ===== تايمر =====
function startTimer(){

clearInterval(timer);
time=15;

timer=setInterval(()=>{
time--;
document.getElementById("timer").innerHTML="⏱️ "+time;

if(time<=0){
clearInterval(timer);
showScreen("categoryScreen");
}
},1000);
}

// ===== سؤال =====
function showQuestion(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("gameScreen").innerHTML=`
<div id="timer">⏱️ 15</div>

<h2>${currentCategory}</h2>
<h3>${q.q}</h3>

<button onclick="showAnswer()">إظهار الإجابة</button>
<button onclick="showScreen('categoryScreen')">رجوع</button>

<div id="ans"></div>
`;

showScreen("gameScreen");
}

// ===== جواب =====
function showAnswer(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("ans").innerHTML=`
<h2>${q.answer}</h2>

<button onclick="addScore(1)">🔴 ${team1Name}</button>
<button onclick="addScore(2)">🔵 ${team2Name}</button>
`;
}

// ===== نقاط =====
function addScore(team){

clearInterval(timer);

if(team==1)score1+=currentPoints;
else score2+=currentPoints;

checkEnd();
showScreen("categoryScreen");
}

// ===== نهاية اللعبة =====
function checkEnd(){

let total=0, done=0;

selectedCategories.forEach(cat=>{
total+=questions[cat].length;
done+=usedQuestions[cat]?.length || 0;
});

if(done>=total){
showEnd();
}
}

function showEnd(){

let winner="تعادل";

if(score1>score2)winner="🔴 "+team1Name;
else if(score2>score1)winner="🔵 "+team2Name;

document.getElementById("endScreen").innerHTML=`
<h1>🏆 انتهت اللعبة</h1>

<h2>الفائز: ${winner}</h2>

<p>🔴 ${team1Name}: ${score1}</p>
<p>🔵 ${team2Name}: ${score2}</p>

<button onclick="location.reload()">إعادة اللعب</button>
`;

showScreen("endScreen");
}

</script>

</body>
</html>
