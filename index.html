<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 لعبة التحدي 🔥</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    direction:rtl;
    text-align:center;
}

.screen{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

button{
    padding:12px 18px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
    transition:0.2s;
}

.start-btn{
    background:red;
    color:white;
    font-size:28px;
}

input{
    padding:10px;
    width:250px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

.jeopardy-board{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

.column{
    background:#1b1b1b;
    padding:12px;
    border-radius:15px;
    width:220px;
}

.category-title{
    background:#ff9800;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
    margin-bottom:10px;
}

.cat-img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:8px;
}

.point-btn{
    width:100%;
    background:#1565c0;
    color:white;
    font-size:18px;
}

.point-btn:disabled{
    background:#333;
}

.scoreboard{
    display:flex;
    justify-content:space-around;
    font-size:22px;
    background:#222;
    padding:15px;
    border-radius:15px;
}

#timer{
    font-size:32px;
    color:yellow;
    margin:15px;
}

.end-btn{
    background:red;
    color:white;
    font-size:22px;
    margin-top:15px;
}

</style>
</head>

<body>

<div id="startScreen" class="screen active">

<h1>🔥 لعبة التحدي 🔥</h1>

<button class="start-btn" onclick="showScreen('teamScreen')">
ابدأ اللعبة
</button>

</div>

<div id="teamScreen" class="screen">

<h1>⚔️ أدخل أسماء الفرق</h1>

<input id="team1" placeholder="الفريق الأول"><br>
<input id="team2" placeholder="الفريق الثاني"><br>

<button onclick="showScreen('categorySelectScreen')">
متابعة
</button>

</div>

<div id="categorySelectScreen" class="screen"></div>
<div id="categoryScreen" class="screen"></div>
<div id="gameScreen" class="screen"></div>
<div id="endScreen" class="screen"></div>

<script>

let team1Name = "";
let team2Name = "";

let score1 = 0;
let score2 = 0;

let selectedCategories = [];
let usedQuestions = {};

let currentCategory = "";
let currentQuestion = 0;
let currentPoints = 0;

let timer;
let time = 0;

// ===== وسائل المساعدة =====
let lifelineBomb = true;
let lifelineHint = true;
let lifelineDouble = true;

let bombActive = false;
let doubleActive = false;

let correctAnswer = "";

// الصور
let categoryImages = {
"معلومات عامة":"images/general.jpg",
"قصص انبياء":"images/anbia.jpg",
"جزء تبارك":"images/quran.jpg",
"رتب الحروف":"images/letters.jpg",
"من هو اللاعب":"images/player.jpg",
"أكلات":"images/food.jpg",
"اعلام":"images/flags.jpg",
"مسلسلات":"images/series.jpg",
"ناروتو":"images/naruto.jpg"
};

// الأسئلة
let questions = {
"معلومات عامة":[
{q:"ما عاصمة الأردن؟",answer:"عمان"},
{q:"كم قارة؟",answer:"7"},
{q:"أكبر محيط؟",answer:"الهادئ"}
],

"قصص انبياء":[
{q:"من ابتلعه الحوت؟",answer:"يونس"},
{q:"من كلم الله؟",answer:"موسى"},
{q:"من بنى السفينة؟",answer:"نوح"}
],

"جزء تبارك":[
{q:"عدد السور؟",answer:"11"},
{q:"أول سورة؟",answer:"الملك"},
{q:"آخر سورة؟",answer:"المرسلات"}
],

"رتب الحروف":[
{q:"ل م ع",answer:"علم"},
{q:"ك ت ب",answer:"كتب"},
{q:"ر د ن",answer:"نرد"}
],

"من هو اللاعب":[
{q:"رقم 7؟",answer:"رونالدو"},
{q:"ميسي؟",answer:"لاعب أرجنتيني"},
{q:"مبابي؟",answer:"لاعب فرنسي"}
],

"أكلات":[
{q:"المنسف؟",answer:"طبق أردني"},
{q:"الفلافل؟",answer:"حمص"},
{q:"المقلوبة؟",answer:"رز وخضار"}
],

"اعلام":[
{q:"علم الأردن؟",answer:"أسود أبيض أخضر أحمر"},
{q:"علم فلسطين؟",answer:"نفس الألوان"},
{q:"علم مصر؟",answer:"أحمر أبيض أسود"}
],

"مسلسلات":[
{q:"الولادة من الخاصرة؟",answer:"مسلسل"},
{q:"البطل؟",answer:"تيم حسن"},
{q:"السنة؟",answer:"2011"}
],

"ناروتو":[
{q:"من هو الهوكاجي السابع؟",answer:"ناروتو"},
{q:"اسم أخ ناروتو؟",answer:"لا يوجد"},
{q:"اسم فريق كاكاشي؟",answer:"الفريق السابع"}
]
};

// تغيير الشاشة
function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// اختيار الفئات
let cats = Object.keys(questions);

let html = "<h2>📚 اختر الفئات (2 أو 4 أو 6 فقط)</h2>";

cats.forEach(cat=>{
html += `<button onclick="toggleCategory(this,'${cat}')">${cat}</button>`;
});

html += `<br><button onclick="startGame()">ابدأ اللعب</button>`;

document.getElementById("categorySelectScreen").innerHTML = html;

function toggleCategory(btn,cat){

if(selectedCategories.includes(cat)){
selectedCategories = selectedCategories.filter(c=>c!==cat);
btn.style.background = "";
}else{
if(selectedCategories.length >= 6){
alert("الحد الأقصى 6 فئات");
return;
}
selectedCategories.push(cat);
btn.style.background = "green";
}
}

// بدء اللعبة
function startGame(){

if(
selectedCategories.length !== 2 &&
selectedCategories.length !== 4 &&
selectedCategories.length !== 6
){
alert("لازم تختار 2 أو 4 أو 6 فئات فقط");
return;
}

team1Name = document.getElementById("team1").value.trim();
team2Name = document.getElementById("team2").value.trim();

if(!team1Name || !team2Name){
alert("اكتب أسماء الفرق");
return;
}

goCategories();
}

// اللوحة
function goCategories(){

let html = `
<div class="scoreboard">
<div>🔴 ${team1Name}: ${score1}</div>
<div>🔵 ${team2Name}: ${score2}</div>
</div>

<div class="jeopardy-board">
`;

selectedCategories.forEach(cat=>{

html += `
<div class="column">

<div class="category-title">
<img src="${categoryImages[cat]}" class="cat-img">
<div>${cat}</div>
</div>
`;

for(let i=0;i<questions[cat].length;i++){

let points = (i+1)*100;

html += `
<button class="point-btn"
onclick="openQuestion('${cat}',${i},${points},this)">
${points}
</button>`;
}

html += `</div>`;
});

html += `</div>`;

document.getElementById("categoryScreen").innerHTML = html;
showScreen("categoryScreen");
}

// فتح السؤال
function openQuestion(cat,index,points,btn){

if(!usedQuestions[cat]) usedQuestions[cat]=[];
if(usedQuestions[cat].includes(index)) return;

usedQuestions[cat].push(index);

currentCategory=cat;
currentQuestion=index;
currentPoints=points;

bombActive=false;
doubleActive=false;

btn.disabled=true;

startTimer();
showQuestion();
}

// عرض السؤال
function showQuestion(){

let q = questions[currentCategory][currentQuestion];
correctAnswer = q.answer;

document.getElementById("gameScreen").innerHTML = `

<div id="timer">⏱️ 0</div>

<h2>${currentCategory}</h2>

<h3>${q.q}</h3>

<button onclick="showAnswer()">إظهار الإجابة</button>

<button onclick="showScreen('categoryScreen')">رجوع</button>

<br><br>

<h3>🧠 وسائل المساعدة</h3>

<button onclick="useBomb()" ${!lifelineBomb?"disabled":""}>💣 قصف</button>
<button onclick="useHint()" ${!lifelineHint?"disabled":""}>🔤 تلميح</button>
<button onclick="useDouble()" ${!lifelineDouble?"disabled":""}>✖️ دبل</button>

<div id="ans"></div>

`;

showScreen("gameScreen");
}

// 💣 قصف
function useBomb(){
if(!lifelineBomb) return;
lifelineBomb=false;
bombActive=true;
alert("💣 تم تفعيل القصف");
}

// 🔤 تلميح
function useHint(){
if(!lifelineHint) return;
lifelineHint=false;

let a = correctAnswer;
alert("🔤 التلميح: " + a[0] + " ... " + a[a.length-1]);
}

// ✖️ دبل
function useDouble(){
if(!lifelineDouble) return;
lifelineDouble=false;
currentPoints*=2;
alert("✖️ تم تفعيل الدبل");
}

// الإجابة
function showAnswer(){

clearInterval(timer);

let q = questions[currentCategory][currentQuestion];

document.getElementById("ans").innerHTML = `
<h2>${q.answer}</h2>

<button onclick="addScore(1)">🔴 ${team1Name}</button>
<button onclick="addScore(2)">🔵 ${team2Name}</button>
`;

}

// النقاط
function addScore(team){

clearInterval(timer);

if(team===1){
score1+=currentPoints;
if(bombActive) score2-=Math.floor(currentPoints/2);
}else{
score2+=currentPoints;
if(bombActive) score1-=Math.floor(currentPoints/2);
}

if(score1<0) score1=0;
if(score2<0) score2=0;

goCategories();
}

// التايمر
function startTimer(){
clearInterval(timer);
time=0;
timer=setInterval(()=>{
time++;
document.getElementById("timer").innerText="⏱️ "+time;
},1000);
}

</script>

</body>
</html>
