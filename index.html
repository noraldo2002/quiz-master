<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 لعبة التحدي 🔥</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    direction:rtl;
    text-align:center;
}

.screen{display:none;padding:20px;}
.active{display:block;}

button{
    padding:12px 18px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.start-btn{background:red;color:white;font-size:28px;}

input{
    padding:10px;
    width:250px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

.jeopardy-board{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-top:20px;
}

.column{
    background:#1b1b1b;
    padding:10px;
    border-radius:15px;
}

.category-title{
    background:#ff9800;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
}

.point-btn{
    width:100%;
    background:#1565c0;
    color:white;
    font-size:20px;
}

.point-btn:disabled{background:#333;}

.scoreboard{
    display:flex;
    justify-content:space-around;
    font-size:22px;
    background:#222;
    padding:15px;
    border-radius:15px;
}

#timer{
    font-size:28px;
    color:yellow;
    margin:10px;
}
</style>
</head>

<body>

<!-- البداية -->
<div id="startScreen" class="screen active">
<h1>🔥 لعبة التحدي 🔥</h1>
<button class="start-btn" onclick="showScreen('teamScreen')">ابدأ اللعبة</button>
</div>

<!-- الفرق -->
<div id="teamScreen" class="screen">
<h1>⚔️ أدخل أسماء الفرق</h1>
<input id="team1" placeholder="الفريق الأول"><br>
<input id="team2" placeholder="الفريق الثاني"><br>
<button onclick="goCategorySelect()">متابعة</button>
</div>

<!-- الفئات -->
<div id="categorySelectScreen" class="screen"></div>

<!-- اللوحة -->
<div id="categoryScreen" class="screen"></div>

<!-- السؤال -->
<div id="gameScreen" class="screen"></div>

<!-- 🏆 شاشة النهاية -->
<div id="endScreen" class="screen"></div>

<script>

let team1Name="", team2Name="";
let score1=0, score2=0;

let selectedCategories=[];
let usedQuestions={};

let currentCategory="";
let currentQuestion=0;
let currentPoints=0;

let timerInterval;

{q:"أكبر محيط؟",answer:"الهادئ"}
],
"قصص انبياء":[
{q:"من النبي الذي ابتلعه الحوت؟",answer:"يونس"},
{q:"من كلم الله؟",answer:"موسى"},
{q:"من بنى السفينة؟",answer:"نوح"}
]

// ===== شاشة =====
function showScreen(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

// ===== اختيار الفئات =====
function goCategorySelect(){

team1Name=document.getElementById("team1").value;
team2Name=document.getElementById("team2").value;

let cats=Object.keys(questions);

let html="<h1>اختار الفئات</h1>";

cats.forEach(cat=>{
html+=`<button onclick="toggleCategory(this,'${cat}')">${cat}</button>`;
});

html+=`<br><button onclick="startGame()">ابدأ</button>`;

document.getElementById("categorySelectScreen").innerHTML=html;
showScreen("categorySelectScreen");
}

function toggleCategory(btn,cat){
if(selectedCategories.includes(cat)){
selectedCategories=selectedCategories.filter(c=>c!==cat);
btn.style.background="";
}else{
selectedCategories.push(cat);
btn.style.background="green";
}
}

function startGame(){
goCategories();
}

// ===== اللوحة =====
function goCategories(){

let html=`

<div>🔴 ${team1Name}: ${score1}</div>
<div>🔵 ${team2Name}: ${score2}</div>
</div>

`;

selectedCategories.forEach(cat=>{
html+=`<div class="column">
<div class="category-title">${cat}</div>`;

for(let i=0;i<questions[cat].length;i++){
let points=(i+1)*100;

html+=`
<button class="point-btn"
onclick="openQuestion('${cat}',${i},${points},this)">
${points}
</button>`;
}

html+=`</div>`;
});

html+=`</div>`;

document.getElementById("categoryScreen").innerHTML=html;
showScreen("categoryScreen");
}

// ===== سؤال =====
function openQuestion(cat,index,points,btn){

if(!usedQuestions[cat])usedQuestions[cat]=[];
if(usedQuestions[cat].includes(index)) return;

usedQuestions[cat].push(index);

currentCategory=cat;
currentQuestion=index;
currentPoints=points;

btn.disabled=true;

startTimer();
showQuestion();
}

// ===== التايمر =====
function startTimer(){

clearInterval(timerInterval);
time=15;

timerInterval=setInterval(()=>{
time--;
document.getElementById("timer").innerHTML="⏱️ "+time;

if(time<=0){
clearInterval(timerInterval);
showScreen("categoryScreen");
checkEndGame();
}
},1000);
}

// ===== السؤال =====
function showQuestion(){

let q=questions[currentCategory][currentQuestion];

document.getElementById("gameScreen").innerHTML=`
<div id="timer">⏱️ 15</div>

<h2>${currentCategory}</h2>
<h3>${q.q}</h3>

<button onclick="showAnswer()">إظهار الإجابة</button>
<button onclick="showScreen('categoryScreen')">رجوع</button>

<div id="ans"></div>
`;

showScreen("gameScreen");
}
