<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>سين جيم - Quiz Game</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: radial-gradient(circle, #0b1220, #05070f);
    color: white;
    margin: 0;
}

/* Buttons */
button {
    padding: 14px;
    margin: 6px;
    width: 85%;
    border: none;
    border-radius: 15px;
    font-size: 16px;
}

.category {
    background: linear-gradient(45deg, #2563eb, #3b82f6);
    color: white;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

.option {
    background: #111827;
    border: 1px solid #334155;
    color: white;
}

#container { margin-top: 30px; }

/* Splash */
#splashScreen{
position:fixed;
top:0; left:0;
width:100%; height:100%;
background:#05070f;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* Result */
#result { display:none; }

/* Question */
#question {
    margin: 20px;
    font-size: 18px;
}

input {
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-size:16px;
    width:70%;
}
</style>
</head>

<body>

<!-- 🚀 SPLASH -->
<div id="splashScreen">

<h1>🎮 سين جيم</h1>

<input id="playerName" placeholder="اكتب اسمك">

<button onclick="startApp()" style="background:#22c55e; color:white;">
ابدأ اللعب
</button>

</div>

<h2>🎮 سين جيم</h2>

<div id="container">

<!-- MENU -->
<div id="menu" style="display:none;">

<button class="category" onclick="startQuiz('general')">📚 معلومات عامة</button>
<button class="category" onclick="startQuiz('science')">🔬 علوم</button>
<button class="category" onclick="startQuiz('sports')">⚽ رياضة</button>
<button class="category" onclick="startQuiz('series')">🎬 مسلسلات عربية</button>

</div>

<!-- GAME -->
<div id="game" style="display:none;">

<div>
⭐ النقاط: <span id="score">0</span>
</div>

<h3 id="question"></h3>

<button class="option" onclick="answer('A')" id="A"></button>
<button class="option" onclick="answer('B')" id="B"></button>
<button class="option" onclick="answer('C')" id="C"></button>
<button class="option" onclick="answer('D')" id="D"></button>

<p>⏱ الوقت: <span id="time">15</span></p>

</div>

<!-- RESULT -->
<div id="result">
<h2>🎉 انتهت اللعبة</h2>
<p id="finalText"></p>
<button onclick="location.reload()">إعادة اللعب</button>
</div>

</div>

<script>

let player = "";

/* 🚀 تشغيل التطبيق */
function startApp(){
 player = document.getElementById("playerName").value;

 if(player == ""){
  alert("اكتب اسمك أولاً");
  return;
 }

 document.getElementById("splashScreen").style.display="none";
 document.getElementById("menu").style.display="block";
}

/* 🎯 الأسئلة */
let data = {
 general: [
  {q:"ما عاصمة الأردن؟", a:"عمان", b:"دمشق", c:"بيروت", d:"بغداد", correct:"A"},
  {q:"عدد قارات العالم؟", a:"5", b:"6", c:"7", d:"8", correct:"C"},
  {q:"عملة الأردن؟", a:"دينار", b:"دولار", c:"يورو", d:"ريال", correct:"A"}
 ],

 science: [
  {q:"أكبر كوكب؟", a:"الأرض", b:"المريخ", c:"المشتري", d:"الزهرة", correct:"C"},
  {q:"وحدة القوة؟", a:"نيوتن", b:"جول", c:"واط", d:"أمبير", correct:"A"},
  {q:"عدد الكواكب؟", a:"7", b:"8", c:"9", d:"10", correct:"B"}
 ],

 sports: [
  {q:"لاعبين كرة القدم؟", a:"9", b:"10", c:"11", d:"12", correct:"C"},
  {q:"كم شوط؟", a:"1", b:"2", c:"3", d:"4", correct:"B"},
  {q:"مدة المباراة؟", a:"90", b:"80", c:"100", d:"70", correct:"A"}
 ],

 series: [
  {q:"بطل الولادة من الخاصرة؟", a:"تيم حسن", b:"قصي خولي", c:"باسل خياط", d:"معتصم النهار", correct:"B"},
  {q:"بلد التصوير؟", a:"سوريا", b:"لبنان", c:"الأردن", d:"مصر", correct:"A"},
  {q:"نوع المسلسل؟", a:"دراما اجتماعية", b:"كوميدي", c:"أكشن", d:"رعب", correct:"A"}
 ]
};

let questions = [];
let current = 0;
let score = 0;
let timer;
let timeLeft = 15;

/* 🔀 خلط */
function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

/* 🎮 بدء */
function startQuiz(cat){
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 questions = shuffle(data[cat]);
 current = 0;
 score = 0;

 updateScore();
 loadQuestion();
 startTimer();
}

/* ❓ سؤال */
function loadQuestion(){
 let q = questions[current];

 document.getElementById("question").innerText =
 "❓ " + q.q + " (" + (current+1) + "/" + questions.length + ")";

 document.getElementById("A").innerText = q.a;
 document.getElementById("B").innerText = q.b;
 document.getElementById("C").innerText = q.c;
 document.getElementById("D").innerText = q.d;

 timeLeft = 15;
 document.getElementById("time").innerText = timeLeft;

 enableButtons();
}

/* 🔘 إجابة */
function answer(choice){
 let q = questions[current];

 disableButtons();

 if(choice == q.correct){
  score += 10;
  updateScore();
 }

 clearInterval(timer);
 setTimeout(nextQuestion, 600);
}

/* ⏭ التالي */
function nextQuestion(){
 current++;

 if(current >= questions.length){
  endGame();
 } else {
  loadQuestion();
  startTimer();
 }
}

/* ⏱ Timer */
function startTimer(){
 clearInterval(timer);

 timer = setInterval(()=>{
  timeLeft--;
  document.getElementById("time").innerText = timeLeft;

  if(timeLeft <= 0){
    nextQuestion();
  }
 },1000);
}

/* ⭐ نقاط */
function updateScore(){
 document.getElementById("score").innerText = score;
}

/* 🔒 أزرار */
function disableButtons(){
 ["A","B","C","D"].forEach(id=>{
  document.getElementById(id).disabled = true;
 });
}

function enableButtons(){
 ["A","B","C","D"].forEach(id=>{
  document.getElementById(id).disabled = false;
 });
}

/* 🏁 نهاية */
function endGame(){
 clearInterval(timer);

 document.getElementById("game").style.display="none";
 document.getElementById("result").style.display="block";

 let grade = "";

 if(score >= 80){
  grade = "🔥 أسطورة سين جيم";
 } else if(score >= 50){
  grade = "👍 لاعب جيد";
 } else {
  grade = "😐 حاول مرة أخرى";
 }

 document.getElementById("finalText").innerText =
 "👤 اللاعب: " + player +
 "\n⭐ النقاط: " + score +
 "\n🏆 " + grade;
}

</script>

</body>
</html>
