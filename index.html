.screen{display:none;padding:20px;}
.active{display:block;}

    border-radius:10px;
    font-size:18px;

}

}

}

.point-btn{

    background:#1565c0;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.point-btn:disabled{
    background:#333;
}

.scoreboard{
    display:flex;
    justify-content:space-around;
    font-size:24px;
    background:#222;
    padding:15px;
    border-radius:15px;
}

</style>

</head>
